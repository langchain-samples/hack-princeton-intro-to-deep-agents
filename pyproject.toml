[project]
name = "modular-workshops"
version = "0.1.0"
description = "Deep Agents workshop"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120",
    "deepagents>=0.7",
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.7",
    "langchain-aws>=1.0.0",
    "langchain-openai>=1.0.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "notebook>=7.4.7",
    "python-dotenv>=1.1.1",
    "langchain-core>=1.5.3",
    "langgraph-cli[inmem]>=0.4",
]

[tool.setuptools]
packages = ["utils"]
